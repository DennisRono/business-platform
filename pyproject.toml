[tool.poetry]
name = "business-platform"
version = "1.0.0"
description = "Business Platform — FastAPI service built from the reusable FastAPI scaffold."
authors = ["DennisRono"]
readme = "README.md"
packages = [
    { include = "app" },
    { include = "business_platform" },
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.120.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
asyncpg = "^0.30.0"
alembic = "^1.14.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
bcrypt = "^4.2.0"
python-multipart = "^0.0.12"
email-validator = "^2.2.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.7.0"
black = "^24.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI dependency injection uses function calls in defaults

[tool.black]
line-length = 100
target-version = ["py311"]