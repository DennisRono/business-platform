apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: business-platform
  namespace: business-platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.example.com
      secretName: business-platform-tls
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: business-platform
                port:
                  number: 80
