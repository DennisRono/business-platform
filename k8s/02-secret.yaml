apiVersion: v1
kind: Secret
metadata:
  name: business-platform-secret
  namespace: business-platform
type: Opaque
# PLACEHOLDERS ONLY. Replace each value with a real base64-encoded secret before
# applying (`echo -n 'value' | base64`), or manage via an external secrets
# operator / sealed-secrets. Never commit real secret material to git.
data:
  SECRET_KEY: "" # base64 of a strong random key (openssl rand -hex 32)
  POSTGRES_USER: "" # base64 of the DB user
  POSTGRES_PASSWORD: "" # base64 of the DB password
