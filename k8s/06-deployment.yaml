apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-platform
  namespace: business-platform
  labels:
    app.kubernetes.io/name: business-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: business-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: business-platform
    spec:
      serviceAccountName: business-platform
      containers:
        - name: api
          image: ghcr.io/dennisrono/business-platform:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: business-platform-config
            - secretRef:
                name: business-platform-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
